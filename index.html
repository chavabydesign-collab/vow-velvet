<html lang="en" data-theme="light" data-pal="velvet">
<head>
<meta charset="utf-8">

<title>Chava Soirée</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --hero:#1f3a2e;--hero2:#2c4d3f;--gold:#b8975a;--gold-soft:#e9dcc0;
  --bg:#faf6f0;--card:#fffdf9;--ink:#26211c;--mute:#7a7066;--line:#e8dfd2;--field:#f4eee5;--blush:#f6e4de;--on-hero:#f8f1e4;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-pal="rose"]{--hero:#6b2f3f;--hero2:#85445a;--gold:#c0956a;--blush:#f8e3e3}
:root[data-pal="midnight"]{--hero:#1d2640;--hero2:#2e3a5c;--gold:#c9a96a;--blush:#e9e6f2}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#15130f;--card:#1e1b16;--ink:#f1e9dc;--mute:#a79c8d;--line:#332e26;--field:#28241d;--blush:#3a2c2c;--gold-soft:#4a3f29;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#15130f;--card:#1e1b16;--ink:#f1e9dc;--mute:#a79c8d;--line:#332e26;--field:#28241d;--blush:#3a2c2c;--gold-soft:#4a3f29;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.wrap{max-width:480px;margin:0 auto;padding-bottom:96px;min-height:100vh}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;letter-spacing:.01em}
header{background:var(--hero);color:var(--on-hero);padding:22px 20px 40px;border-radius:0 0 36px 36px;position:relative}
header::after{content:"";position:absolute;left:50%;bottom:-1px;width:64px;height:3px;margin-left:-32px;background:var(--gold);border-radius:3px 3px 0 0}
.top{display:flex;align-items:center;gap:14px}
.mono{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;font:italic 600 21px "Cormorant Garamond",serif;color:var(--gold);box-shadow:0 0 0 4px var(--hero2)}
.top h1{font-size:30px;line-height:1}
.top p{margin:4px 0 0;font-size:13px;color:var(--gold-soft);opacity:.9}
.style{margin-left:auto;border:1px solid var(--gold);background:transparent;color:var(--on-hero);border-radius:999px;padding:7px 13px;font:500 13px "Figtree",sans-serif;cursor:pointer;display:flex;gap:7px;align-items:center}
.style i{width:10px;height:10px;border-radius:50%;background:var(--gold)}
main{padding:0 16px;margin-top:-18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px 26px 26px 8px;padding:22px 20px;margin-bottom:18px;box-shadow:0 10px 30px -18px rgba(40,30,20,.35)}
.arch{text-align:center;background:var(--blush);border:1px solid var(--gold);border-radius:999px 999px 26px 26px;padding:44px 20px 26px;margin:34px 10px 20px;position:relative}
.arch::before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);border-radius:999px 999px 20px 20px;opacity:.5;pointer-events:none}
.kind{margin:0;font-size:13px;color:var(--mute);font-weight:500}
.count{font:600 76px/1 "Cormorant Garamond",serif;color:var(--hero);margin:8px 0 0}
:root[data-theme="dark"] .count{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .count{color:var(--gold)}}
.unit{margin:0 0 14px;font:italic 500 19px "Cormorant Garamond",serif;color:var(--mute)}
.arch h2{font-size:26px;line-height:1.15}
.when{margin:4px 0 0;font-size:14px;color:var(--mute)}
h3{font-size:26px}
.sub{margin:2px 0 16px;color:var(--mute);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:8px 13px;font:500 14px "Figtree",sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--hero);border-color:var(--hero);color:var(--on-hero)}
input,select{width:100%;background:var(--field);border:1px solid var(--line);color:var(--ink);border-radius:16px;padding:14px 16px;font:400 16px "Figtree",sans-serif;margin-bottom:10px;min-width:0}
input::placeholder{color:var(--mute);opacity:.8}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px}
.btn{width:100%;border:0;background:var(--hero);color:var(--on-hero);border-radius:16px;padding:15px;font:600 16px "Figtree",sans-serif;cursor:pointer}
.btn.soft{background:var(--gold-soft);color:var(--ink)}
.btn:active{transform:scale(.985)}
.bhead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:600 22px "Cormorant Garamond",serif}
.bhead dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:14px}
.bhead dt{color:var(--mute)}.bhead dd{margin:0;text-align:right;font-weight:600}
.due{display:inline-block;margin-top:8px;background:var(--blush);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600}
.list{list-style:none;margin:14px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.list .main{flex:1;min-width:0}
.list b{font-weight:600;display:block;overflow-wrap:anywhere}
.list small{color:var(--mute);font-size:13px}
.x{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
.tag{border:1px solid var(--gold);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px "Figtree",sans-serif;cursor:pointer}
.tag.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.time{font:600 20px "Cormorant Garamond",serif;color:var(--gold);min-width:64px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:14px 0 2px;margin:0}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stats div{flex:1;background:var(--field);border-radius:16px;padding:10px 12px;text-align:center}
.stats b{display:block;font:600 24px "Cormorant Garamond",serif}.stats small{color:var(--mute);font-size:12px}
.invite{text-align:center;background:var(--hero);color:var(--on-hero);border-radius:26px;padding:30px 22px;margin-bottom:18px;position:relative}
.invite::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:19px;opacity:.7;pointer-events:none}
.invite p{margin:0;color:var(--gold-soft);font-size:14px}
.invite h2{font-size:34px;line-height:1.1;margin:8px 0;font-style:italic}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav div{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px;box-shadow:0 12px 30px -12px rgba(30,20,10,.4);width:100%;max-width:456px}
nav button{flex:1;border:0;background:none;color:var(--mute);border-radius:999px;padding:11px 2px;font:500 13px "Figtree",sans-serif;cursor:pointer}
nav button[aria-current="page"]{background:var(--hero);color:var(--on-hero)}
@media (prefers-reduced-motion:no-preference){.arch{animation:rise .6s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}}

.tagline{margin:18px 0 0;text-align:center;font:italic 500 21px "Cormorant Garamond",Georgia,serif;color:#e9dcc0}.style{flex:none}
.credit{text-align:center;margin:8px 16px 0;font:italic 500 17px "Cormorant Garamond",Georgia,serif;color:var(--mute)}
.evbar{display:flex;gap:8px;overflow-x:auto;margin-top:30px;padding:2px 2px 8px;scrollbar-width:none}
.evbar .chip{flex:none;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}
.evbar+*{margin-top:12px!important}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 14px}
.thumbs button{border:1.5px solid var(--line);background:var(--field);border-radius:16px;padding:8px 6px 6px;cursor:pointer;color:var(--ink);font:500 13px "Figtree",sans-serif}
.thumbs button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.thumbs canvas{width:100%;height:auto;border-radius:8px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--hero);color:var(--on-hero);padding:12px 18px;border-radius:999px;font:500 14px "Figtree",sans-serif;z-index:30;max-width:90%;text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.pend{background:var(--blush);border-radius:18px;padding:14px;margin-top:14px}
body{background-image:radial-gradient(circle at 15% 0%,rgba(184,151,90,.10),transparent 38%),radial-gradient(circle at 100% 35%,rgba(44,77,63,.07),transparent 42%);background-attachment:fixed}
header{background:radial-gradient(circle at 88% 0%,rgba(201,169,106,.28),transparent 46%),radial-gradient(circle at 8% 100%,rgba(255,255,255,.06),transparent 40%),linear-gradient(135deg,var(--hero),var(--hero2))}
.card{box-shadow:0 16px 36px -22px rgba(40,30,20,.5)}
.arch{background:linear-gradient(165deg,var(--mood,var(--blush)),var(--card));animation:none}
.arch .bigemo{display:block;font-size:46px;margin-bottom:2px}
.bigemo{display:inline-block;line-height:1}
.tabhead{display:flex;align-items:center;gap:14px;margin:14px 6px}
.tabhead h2{font-size:32px;line-height:1.05}
.tabhead p{margin:2px 0 0;color:var(--mute);font-size:14px}
.tabhead .bigemo{font-size:44px}
.tabhead+*{margin-top:0!important}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px 8px;font-size:12px}
nav button span{font-size:18px;line-height:1.1}
.cgrid button.hs::after,.cgrid button.ht::before{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;left:50%;margin-left:-2.5px}
.cgrid button.hs::after{background:var(--gold)}
.cgrid button.ht::before{background:#4f9d8a}
.cgrid button.hs.ht::after{margin-left:1px}
.cgrid button.hs.ht::before{margin-left:-6px}
.legend{font-size:12px;color:var(--mute);margin:8px 0 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.d1{background:var(--gold)}.d2{background:#4f9d8a}.d3{border:1.5px solid var(--gold);background:var(--blush)}
.cf{position:fixed;z-index:40;pointer-events:none;border-radius:2px}
@media (prefers-reduced-motion:no-preference){
#view.anim>*{animation:rise2 .55s cubic-bezier(.2,.7,.2,1) both}
#view.anim>*:nth-child(2){animation-delay:.06s}#view.anim>*:nth-child(3){animation-delay:.12s}#view.anim>*:nth-child(4){animation-delay:.18s}#view.anim>*:nth-child(5){animation-delay:.24s}#view.anim>*:nth-child(n+6){animation-delay:.3s}
@keyframes rise2{from{opacity:0;transform:translateY(18px) scale(.985)}}
.bigemo{animation:bob 3.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.mono{animation:glow 4s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 4px var(--hero2),0 0 18px 2px rgba(201,169,106,.45)}}
nav button[aria-current="page"] span{animation:pop .45s ease}@keyframes pop{40%{transform:translateY(-4px) scale(1.25)}}
.btn,.chip,.tag,.lnk{transition:transform .12s ease}
.btn:active,.chip:active,.tag:active,.lnk:active{transform:scale(.96)}}
.lbl{display:block;font-size:12px;color:var(--mute);margin:0 0 4px 6px}
select{appearance:none}
.cal{margin:14px 0}.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.chead b{font:600 22px "Cormorant Garamond",serif}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cgrid span{font-size:12px;color:var(--mute);padding:4px 0}
.cgrid button{position:relative;aspect-ratio:1;border:1px solid transparent;border-radius:50%;background:none;color:var(--ink);font:500 15px "Figtree",sans-serif;cursor:pointer;padding:0}
.cgrid button.td{border-color:var(--line)}.cgrid button.ev{border-color:var(--gold);background:var(--blush)}
.cgrid button.sel{background:var(--hero);color:var(--on-hero)}
.cgrid button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.lnk{display:block;text-align:center;text-decoration:none;border:1px solid var(--gold);color:var(--ink);border-radius:16px;padding:13px;font:600 15px "Figtree",sans-serif;background:none;cursor:pointer;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pri{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--blush);font-weight:600}
.late{color:#b0413e;font-weight:600}
.notice{font-size:13px;color:var(--mute);margin:10px 0 0}
#ov{position:fixed;inset:0;z-index:20;background:rgba(15,12,8,.7);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
#ov .box{max-width:480px;margin:0 auto;background:var(--card);border-radius:26px;padding:20px}
#ov img,#ov video{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:10px;display:block}

a.tag{text-decoration:none;display:inline-block}
.hero{margin:6px 0 16px;border-radius:24px;overflow:hidden;position:relative;aspect-ratio:3/2;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(circle at 72% 18%,rgba(201,169,106,.5),transparent 55%),linear-gradient(135deg,var(--hero),var(--hero2));box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.5))}
.hero .ht{position:relative;z-index:1;text-align:center;color:#fff;padding:0 18px 18px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero .ht b{display:block;font:italic 600 24px "Cormorant Garamond",Georgia,serif;line-height:1.15;margin-top:4px}.hc{font:600 68px/1 "Cormorant Garamond",Georgia,serif;color:#f3e3b3}.hero .ht p{margin:2px 0 0;font:600 13px Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase}.hero .ht small{display:block}
.hero{padding-top:18px}.he{font-size:40px;line-height:1;margin-bottom:2px}
.vvt{display:flex;flex-direction:column;align-items:center;gap:12px;margin:28px 0 8px}.vvt div{display:flex;gap:14px}
.vvp{width:94px;height:60px;border-radius:30px;border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px Figtree,sans-serif;letter-spacing:.12em;cursor:pointer}.vvp b{font-size:21px;line-height:1.1}
.vvp.l{background:#fff;color:#4a3b22}.vvp.d{background:#1b1713;color:#f3e3b3}.vvp[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(201,169,106,.45)}
.vvt small{font:500 12px Figtree,sans-serif;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
:root[data-theme="light"]{--bg:#f8eeed}
header{background:var(--card);color:var(--ink);padding:12px 16px;border-radius:0;box-shadow:0 1px 0 var(--line)}header::after,.tagline{display:none}
.top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.top h1{font:500 29px/1 "Cormorant Garamond",Georgia,serif;text-align:center;color:var(--ink)}
.mono{width:44px;height:auto;border:0;border-radius:0;background:none;font-size:21px;box-shadow:none;animation:none}.tile{box-shadow:0 4px 16px rgba(60,40,30,.06)}.arch{margin-top:6px}
.hb i,.hb i::before,.hb i::after{background:var(--ink)}.mn{top:62px}
:root[data-pal="gray"]{--hero:#4b4e54;--hero2:#6c7078;--gold:#b7b1a6;--blush:#ececee}
:root[data-pal="gold"]{--hero:#7d5f26;--hero2:#b08d45;--gold:#c9a24d;--blush:#f7ecd0}
:root[data-theme="light"][data-pal="gray"]{--bg:#f0f0f1}:root[data-theme="light"][data-pal="gold"]{--bg:#faf3e2}
.mn button{display:flex;gap:12px;align-items:center}.ic{filter:url(#sk);flex:none}.vvp b{display:flex}.he{height:44px}.hero .ht p.kd{font-weight:700;margin-top:6px}
.back{border:0;background:none;color:var(--ink);font:600 15px Figtree,sans-serif;padding:6px 2px;cursor:pointer;margin:2px 0}.hero .ht small{font:500 13px Figtree,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:20px;font:600 13px Figtree,sans-serif;cursor:pointer}
.tile span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--mood)}.tile:active{transform:scale(.95)}
.hb{flex:none;width:42px;height:42px;border:1px solid var(--gold);background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.hb i{display:block;position:relative;width:18px;height:2px;background:var(--on-hero);border-radius:2px}.hb i::before,.hb i::after{content:"";position:absolute;left:0;width:18px;height:2px;background:var(--on-hero);border-radius:2px}.hb i::before{top:-6px}.hb i::after{top:6px}
.mn{position:absolute;right:16px;top:78px;z-index:6;background:var(--bg);color:var(--ink);border:1px solid var(--gold);border-radius:18px;padding:6px;min-width:190px;box-shadow:0 12px 30px rgba(0,0,0,.28)}
.mn button{display:block;width:100%;border:0;background:none;color:inherit;padding:11px 12px;font:500 15px Figtree,sans-serif;text-align:left;border-radius:12px;cursor:pointer}input[type=file]{padding:11px 14px;font-size:14px}

:root[data-pal="coral"]{--hero:#FF4D4D;--hero2:#ff8080;--gold:#c9a96a;--blush:#fff1f1}
:root[data-pal="indigo"]{--hero:#4F46E5;--hero2:#7c75f0;--gold:#c9a96a;--blush:#eeedff}

  else if(a==="paypl"){var q=S.pledges[i];ask("Add payment (remaining "+money(q.a-rec(q))+")",[["Amount received now","","number"]],function(v){var n=parseFloat(v[0]);if(n>0){q.d=(q.d||0)+n;if(q.d>=q.a)q.r=true}});return}
  else if(a==="editpl"){var q=S.pledges[i];ask("Edit pledge",[["Contributor name",q.n],["Pledge amount",q.a,"number"],["Received so far",rec(q),"number"]],function(v){var a2=parseFloat(v[1]),dd=parseFloat(v[2]);if(v[0].trim())q.n=v[0].trim();if(a2>0)q.a=a2;if(dd>=0){q.d=dd;q.r=dd>=q.a}});return}
  else if(a==="delexp"){S.exp.splice(i,1)}
  else if(a==="mon"){var q=S.cal.split("-"),d=new Date(+q[0],+q[1]-1+ +b.dataset.v,1);S.cal=ymd(d.getFullYear(),d.getMonth(),1).slice(0,7)}
  else if(a==="day"){S.sel=b.dataset.v}
  else if(a==="addsch"){var w=val("sw");if(!w){f("sw");return}S.sched.push({d:S.sel,t:val("st"),w:w})}
  else if(a==="bell"){if(!b.dataset.d){toast("Add a date first to set a reminder");return}window.open(remLink(b.dataset.t,b.dataset.d,b.dataset.m||""),"_blank");return}
  else if(a==="delsch"){S.sched.splice(i,1)}
  else if(a==="addtask"){var k=val("tk");if(!k){f("tk");return}S.tasks.push({k:k,o:val("to"),p:val("tp"),d:val("td"),pr:val("tpr"),n:val("tn"),x:0})}
  else if(a==="togtask"){S.tasks[i].x=S.tasks[i].x?0:1;if(S.tasks[i].x)burst(ev.clientX,ev.clientY)}
  else if(a==="deltask"){S.tasks.splice(i,1)}
  else if(a==="addpl"){var pn=val("pn"),pa=num("pa");if(!pn||!pa){f(pn?"pa":"pn");return}S.pledges.push({n:pn,a:pa,r:false})}
  else if(a==="togpl"){S.pledges[i].r=!S.pledges[i].r;if(S.pledges[i].r)burst(ev.clientX,ev.clientY)}
  else if(a==="delpl"){S.pledges.splice(i,1)}
  else if(a==="addg"){var g=val("gn");if(!g){f("gn");return}S.guests.push({n:g,s:0,p:val("gp"),tb:val("gt"),e:val("ge")})}
  else if(a==="addv"){var vn=val("vn");if(!vn){f("vn");return}S.vendors.push({n:vn,r:val("vr"),p:val("vp")})}
  else if(a==="delv"){S.vendors.splice(i,1)}
  else if(a==="paper"){var pi=+b.dataset.v,PD=[[0,1],[3,0],[4,2],[5,0],[6,1]][pi];S.inv.paper=pi;S.inv.c=PD[0];S.inv.fs=PD[1]}
  else if(a==="fs"){S.inv.fs=+b.dataset.v}
  else if(a==="stk"){var sk=S.inv.stk||[],ix=sk.indexOf(b.dataset.v);if(ix>-1)sk.splice(ix,1);else if(sk.length<6)sk.push(b.dataset.v);S.inv.stk=sk}
  else if(a==="sugg"){var r=sugg().filter(function(x){return x[0]===b.dataset.v})[0];if(r){var dd="";if(S.date){var q=S.date.split("-"),z=new Date(+q[0],+q[1]-1,+q[2]-r[1]);dd=ymd(z.getFullYear(),z.getMonth(),z.getDate())}S.tasks.push({k:r[0],o:"",p:"",d:dd,pr:r[2]||"Medium",n:"",x:0})}}
  else if(a==="edtask"){var t=S.tasks[i];ask("Edit task",[["Task",t.k],["Assigned to (name)",t.o||""],["Phone",t.p||"","tel"],["Due date",t.d||"","date"],["Priority",t.pr||"Medium","select",["High","Medium","Low"]],["Notes",t.n||""]],function(v){if(v[0].trim())t.k=v[0].trim();t.o=v[1].trim();t.p=v[2].trim();t.d=v[3];t.pr=v[4];t.n=v[5].trim()});return}
  else if(a==="starter"){var TL=sugg(),have={};S.tasks.forEach(function(t){have[t.k]=1});TL.forEach(function(r){if(have[r[0]])return;var dd="";if(S.date){var q=S.date.split("-"),z=new Date(+q[0],+q[1]-1,+q[2]-r[1]);dd=ymd(z.getFullYear(),z.getMonth(),z.getDate())}S.tasks.push({k:r[0],o:"",p:"",d:dd,pr:r[2],n:"",x:0})})}
  else if(a==="gshpdf"||a==="gshpng"){exportSheets(true,"guests",a==="gshpdf"?"pdf":"png");return}
  else if(a==="xfer"){S.xfer=!S.xfer}
  else if(a==="sendev"){var js=pack();deliver([{name:"chava-soiree-"+slug()+".json",blob:new Blob([js],{type:"application/json"})}],null,null,true,"Event: "+(S.title||S.type)+". To open it: Chava Soirée, Share tab, Send event to another phone, Receive an event.");return}
  else if(a==="copyev"){var js2=pack();try{navigator.clipboard.writeText(js2).then(function(){toast("Copied. Paste it in WhatsApp.")},function(){toast("Couldn’t copy. Use Send on WhatsApp.")})}catch(e){toast("Couldn’t copy. Use Send on WhatsApp.")}return}
  else if(a==="recvev"){var rt=val("rct");if(!rt){toast("Choose a file or paste the text first.");return}importEvent(rt);return}
  else if(a==="imprep"){var po=pendImp,ex2=S.evs.filter(function(e){return e.id===po.id})[0];if(ex2.id===S.cur)loadSnap(po.snap);else ex2.snap=po.snap;pendImp=null;toast("Updated “"+(po.snap.title||po.snap.type)+"”")}
  else if(a==="impcopy"){addImp(pendImp,uid());return}
  else if(a==="impno"){pendImp=null}
  else if(a==="bksave"){deliver([{name:"chava-soiree-backup-"+TODAY+".json",blob:new Blob([JSON.stringify(S)],{type:"application/json"})}],null,null,false,"Chava Soirée backup");return}
  else if(a==="bkcopy"){try{navigator.clipboard.writeText(JSON.stringify(S)).then(function(){alert("Backup copied. Paste it somewhere safe, like a WhatsApp chat with yourself.")},function(){alert("Couldn’t copy. Use Save backup instead.")})}catch(e){alert("Couldn’t copy. Use Save backup instead.")}return}
  else if(a==="bkrestore"){restore(val("bkt"));return}
  else if(a==="cycg"){S.guests[i].s=(S.guests[i].s+1)%3;if(S.guests[i].s===1)burst(ev.clientX,ev.clientY)}
  else if(a==="delg"){S.guests.splice(i,1)}
  else if(a==="cw"){S.inv.c=+b.dataset.v}
  else if(a==="invpng"){invoke("png");return}
  else if(a==="invpdf"){invoke("pdf");return}
  else if(a==="invshare"){invoke("png",true);return}
  else if(a==="invvid"){recVideo();return}
  else if(a==="sec"){S.sh[b.dataset.v]=S.sh[b.dataset.v]?0:1}
  else if(a==="theme"){S.theme=b.dataset.v}
  else if(a==="fmt"){S.fmt=b.dataset.v}
  else if(a==="ev"){grab();curEv().snap=snap();var nx=S.evs.filter(function(e){return e.id===b.dataset.v})[0];loadSnap(nx.snap);S.cur=nx.id}
  else if(a==="newev"){burst(ev.clientX,ev.clientY);grab();curEv().snap=snap();var nid=uid();S.evs.push({id:nid,snap:null});loadSnap(null);S.cur=nid;S.tab="overview";window.scrollTo(0,0)}
  else if(a==="delev"){if(!delArm){delArm=true;render();return}delArm=false;S.evs=S.evs.filter(function(e){return e.id!==S.cur});var f2=S.evs[0];loadSnap(f2.snap);S.cur=f2.id;window.scrollTo(0,0)}
  else if(a==="exp"){exportSheets(false);return}
  else if(a==="expshare"){exportSheets(true);return}
  render()});
render();
</script>
<script>
var TS=[[null,"Let’s take a quick tour","See where everything lives. It takes less than a minute."],[".evbar","Your events","Each event has its own chip. Tap + New event to plan another one: a wedding, kitchen party, birthday and more."],[".tile:nth-child(8)","Start here","Open Event details to choose your event type and set its name and date. Your countdown appears on the card above."],[".arch","Your event at a glance","See the live countdown, plus a bell to set a calendar reminder for the big day."],[".tile","Tap a tile to open a page","Tasks, Budget, Guests, Vendors, Invitations, Pledges, Calendar and Share. Each one has a ‹ Home button to come back."],[".hb","The menu","Jump to any page, change the colour, or replay this tour anytime."],[".seg","Light or Dark","Pick the look that is easiest on your eyes."],[null,"You are all set","Everything is saved on this phone and works without internet. Enjoy planning!"]];
function tour(k,L){L=L||TS;var o=document.getElementById("tour");if(!o){o=document.createElement("div");o.id="tour";document.body.appendChild(o)}
 if(k>=L.length){o.remove();if(L===TS){S.seen=1;if(!S.priv)setTimeout(privacy,350)}else{S.pt=S.pt||{};S.pt[S.tab]=1}save();window.scrollTo(0,0);return}
 var st=L[k],el=st[0]&&document.querySelector(st[0]);if(el)el.scrollIntoView({block:"center"});
 setTimeout(function(){var r=el?el.getBoundingClientRect():null,W=innerWidth,H=innerHeight,tw=Math.min(310,W-32),pd=8,
  hl=r?'<div class="thl" style="left:'+(r.left-pd)+'px;top:'+(r.top-pd)+'px;width:'+(r.width+2*pd)+'px;height:'+(r.height+2*pd)+'px"></div>':'<div class="thl" style="left:50%;top:50%;width:0;height:0"></div>',
  below=!r||r.bottom+pd+200<H,tx=r?Math.min(Math.max(16,r.left+r.width/2-tw/2),W-tw-16):(W-tw)/2,ax=r?Math.min(Math.max(20,r.left+r.width/2-tx-8),tw-36):0;
  o.innerHTML=hl+'<div class="tip" style="left:'+tx+'px;top:'+(r?r.bottom+pd+14:H/2-100)+'px;width:'+tw+'px">'+(r?'<i class="arw" style="left:'+ax+'px;'+(below?"top":"bottom")+':-8px"></i>':"")+'<small>'+(k+1)+" / "+L.length+'</small><h4>'+st[1]+'</h4><p>'+st[2]+'</p><div class="trow"><button class="lnk" data-t="skip">Skip</button><button class="btn" data-t="next">'+(k===L.length-1?"Done":"Next")+'</button></div></div>';
  var tp=o.querySelector(".tip");if(r&&!below)tp.style.top=Math.max(10,r.top-pd-14-tp.offsetHeight)+"px";
  o.onclick=function(e){var t=e.target.dataset.t;if(t==="next")tour(k+1,L);else if(t==="skip")tour(99,L)}},150)}
function hashPin(p,salt){var t=salt+":"+p;if(window.crypto&&crypto.subtle)return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")});var h=5381;for(var i=0;i<t.length;i++)h=(h*33)^t.charCodeAt(i);return Promise.resolve("f"+(h>>>0))}
function chk(p){return hashPin(p,S.pin.s).then(function(h){return h===S.pin.h})}
var fails=0,until=0,hiddenAt=0;
function pinPad(o){var old=document.getElementById("lock");if(old)old.remove();var d=document.createElement("div");d.id="lock";var v="",busy=0;
 function draw(m){d.innerHTML='<div class="lk">'+CREST+'<h3>'+o.title+'</h3><p class="lm">'+(m||o.sub||"")+'</p><div class="dots">'+[0,1,2,3].map(function(i){return"<i"+(i<v.length?' class="on"':"")+"></i>"}).join("")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(function(k){return k===""?"<span></span>":'<button data-k="'+k+'">'+k+"</button>"}).join("")+"</div>"+(o.forgot?'<button class="lnk" data-k="forgot">Forgot PIN?</button>':"")+(o.cancel?'<button class="lnk" data-k="cancel">Cancel</button>':"")+"</div>"}
 function done(){document.removeEventListener("keydown",kd);d.remove()}
 function key(k){if(busy)return;if(k==="cancel"){done();return}if(k==="forgot"){forgot();return}if(k==="⌫"||k==="Backspace"){v=v.slice(0,-1);draw();return}if(!/^\d$/.test(k)||v.length>=4)return;v+=k;draw();if(v.length===4){busy=1;Promise.resolve(o.done(v)).then(function(r){busy=0;if(r===true)done();else{v="";draw(r||"Try again")}})}}
 function kd(e){if(e.key==="Escape"&&o.cancel)key("cancel");else key(e.key)}
 d.onclick=function(e){var b=e.target.closest("[data-k]");if(b)key(b.dataset.k)};document.addEventListener("keydown",kd);document.body.appendChild(d);draw()}
function forgot(){var o=document.createElement("div");o.className="mdl top";o.innerHTML='<div class="mbox"><h3>Forgot your PIN?</h3><div class="pv"><p>Your data is private and only on this device, so there is no way to reset the PIN without erasing it.</p><p>If you saved an event file (Share → Send event to another phone), you can import it afterwards.</p></div><div class="mrow"><button class="btn soft" id="mc">Cancel</button><button class="btn" id="mo">Erase all data</button></div></div>';document.body.appendChild(o);document.getElementById("mc").onclick=function(){o.remove()};document.getElementById("mo").onclick=function(){try{localStorage.removeItem("vv-state2")}catch(e){}location.reload()}}
function unlock(cb){pinPad({title:"Enter your PIN",sub:"Chava Soirée is locked",forgot:1,done:function(p){if(Date.now()<until)return"Too many tries. Wait "+Math.ceil((until-Date.now())/1000)+"s";return chk(p).then(function(ok){if(ok){fails=0;cb&&cb();return true}if(++fails>=5){until=Date.now()+30000;fails=0;return"Too many tries. Wait 30 seconds"}return"Wrong PIN. Try again"})}})}
function setPin(a){var salt=String(Math.random()).slice(2);return hashPin(a,salt).then(function(h){S.pin={s:salt,h:h};save();render();toast("PIN lock is on");return true})}
function newPin(){pinPad({title:"Create a PIN",sub:"Choose 4 digits you will remember",cancel:1,done:function(a){setTimeout(function(){pinPad({title:"Confirm your PIN",sub:"Enter the same 4 digits",cancel:1,done:function(b){return b!==a?"PINs did not match. Try again":setPin(a)}})},60);return true}})}
function lockMenu(){if(!S.pin){newPin();return}pinPad({title:"Enter current PIN",cancel:1,done:function(p){return chk(p).then(function(ok){if(!ok)return"Wrong PIN. Try again";setTimeout(function(){var o=document.createElement("div");o.className="mdl";o.innerHTML='<div class="mbox"><h3>App lock is on</h3><div class="mrow"><button class="btn soft" id="lc">Change PIN</button><button class="btn" id="lo">Turn off</button></div><div class="mrow"><button class="btn soft" id="lx">Close</button></div></div>';document.body.appendChild(o);document.getElementById("lx").onclick=function(){o.remove()};document.getElementById("lc").onclick=function(){o.remove();newPin()};document.getElementById("lo").onclick=function(){o.remove();delete S.pin;save();render();toast("PIN lock is off")}},60);return true})}})}
document.addEventListener("visibilitychange",function(){if(document.hidden)hiddenAt=Date.now();else if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&!document.getElementById("lock"))unlock()});
var PT={overview:[["#evq","Pick your event type","Search or scroll the list. Not there? Add your own type just below it."],["#ti","Name your event","Type a name like Mwila & Chanda. It shows on Home and on your invitation."],["#dt","Set the date","Choose the day. Your live countdown starts right away on Home."]],
budget:[[".ccyb","Change currency","Tap here to switch between Kwacha, dollars and more. It changes everywhere in the app."],[".ring","Your budget at a glance","The ring shows how much you have paid out of your total."],["#ev","Add an expense","Type the item, its total cost, and what you have paid so far."],[".list","Pay in parts","Tap + Add payment each time you pay a deposit. Remaining updates by itself. Use Edit to fix a figure, or × to remove."]],
vendors:[["#vn","Add a vendor","Enter their name and pick a role, like Caterer or Photographer."],["#vp","Add their phone","With a number saved, you can call or WhatsApp them in one tap from the list."]],
guests:[[".stats","Who is coming","Counts update as you mark each guest’s reply."],["#gn","Add a guest","Enter the name, phone and table, then set their RSVP."],[".list","Invite in one tap","Use a guest’s WhatsApp button to send their invitation. You can also share the whole list as PDF or picture."]],
schedule:[[".cal","Your calendar","The gold ring is your event day. Dots show planned items. Tap a day to see or add its plan."],["#sw","Plan the day","Add a time and what happens. Tap the bell on any item to set a phone reminder."],["#tk","Tasks","Say who does what and by when. Tap a suggested task to add it, then tap any task to edit or assign it."]],
pledges:[[".ccyb","Change currency","Tap here to switch currency. It changes everywhere in the app."],[".stats","Pledged, received, remaining","The totals update as money comes in."],["#pn","Add a pledge","Enter the contributor’s name and the amount they promised."],[".list","Part payments","When someone gives only part, tap + Add payment. Remaining updates automatically."]],
invites:[[".thumbs","Choose a paper","Five designs, all drawn inside the app. Tap one to preview it."],["#cv","Live preview","Fill in the details below and watch the card change. Save it as a picture or PDF, or share to WhatsApp."],["#wal","Want something custom?","Send a request to the studio on WhatsApp."]],
share:[[".chips","Choose what to share","Pick the guest list, budget, pledges, tasks or vendors, then PDF or picture."],[".card:last-of-type","Send an event to another phone","Export this event as a file so a helper can update it, then import it back."]]};
function pageTour(){if(!S.seen||!PT[S.tab]||(S.pt&&S.pt[S.tab]))return;setTimeout(function(){if(!document.getElementById("tour")&&!document.getElementById("welcome")&&!document.querySelector(".mdl"))tour(0,PT[S.tab])},500)}
function welcome(){var first=!S.seen,w=document.createElement("div");w.id="welcome";w.innerHTML='<div class="wc">'+CREST+'<h1>Chava Soirée</h1><p class="ws">Event Planner</p><i class="wl"></i><p class="wq">“Every beautiful celebration begins with a promise, and a plan.”</p><small>by Chava by Design</small><em class="wcp">© 2026 Chava by Design. All rights reserved.</em></div>'+(first?'<button class="btn wb">Get started</button>':'<span class="wt">Tap to continue</span>');document.body.appendChild(w);
 var done=0,go=function(){if(done)return;done=1;w.classList.add("out");setTimeout(function(){w.remove();if(first)tour(0);else if(!S.priv)privacy()},500)};
 if(first)w.querySelector(".wb").onclick=go;else{w.onclick=go;setTimeout(go,2600)}}
S.pin?unlock(welcome):welcome();
